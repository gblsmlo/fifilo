name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fifilo
          POSTGRES_USER: fifilo
          POSTGRES_PASSWORD: fifilo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fifilo -d fifilo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Check Toolchain
        run: sh scripts/check-toolchain.sh

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Write Environment File
        run: sh scripts/ci-env.sh

      - name: Migrate Database
        run: bun run db:migrate

      - name: Unit and Integration Tests
        run: bun run test

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build API and Web
        run: bun run build

  storybook:
    name: Storybook Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/storybook
        run: bunx playwright install --with-deps chromium chromium-headless-shell

      - name: Component Tests
        run: bun run storybook:test

  e2e:
    name: E2E Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fifilo
          POSTGRES_USER: fifilo
          POSTGRES_PASSWORD: fifilo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fifilo -d fifilo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Write Environment File
        run: sh scripts/ci-env.sh

      - name: Migrate Database
        run: bun run db:migrate

      - name: Seed Database
        run: bun run db:seed

      - name: Install Playwright Chromium
        run: bun run test:e2e:install

      - name: E2E Journeys
        run: bun run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/e2e
          retention-days: 7
