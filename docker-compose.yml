x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  API_PORT: ${API_PORT:-3001}
  # The app connects as POSTGRES_APP_USER, never as POSTGRES_USER: the image
  # always bootstraps POSTGRES_USER as a superuser, and a superuser bypasses
  # FORCE ROW LEVEL SECURITY (Decision 020). `bun run db:bootstrap-roles`
  # creates POSTGRES_APP_USER before anything connects as it.
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_APP_USER:-fifilo_app}:${POSTGRES_APP_PASSWORD:-fifilo_app}@postgres:5432/${POSTGRES_DB:-fifilo}}
  DATABASE_MIGRATION_URL: ${COMPOSE_DATABASE_MIGRATION_URL:-postgresql://${POSTGRES_USER:-fifilo}:${POSTGRES_PASSWORD:-fifilo}@postgres:5432/${POSTGRES_DB:-fifilo}}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-me-123456}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:3001}
  APP_NAME: ${APP_NAME:-Fifilo}
  APP_URL: ${APP_URL:-http://localhost:3000}
  VITE_APP_NAME: ${VITE_APP_NAME:-Fifilo}
  API_BASE_URL: ${API_BASE_URL:-http://api:3001}

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    command: bun run dev --host 0.0.0.0
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - web_package_node_modules:/app/apps/web/node_modules
      - auth_package_node_modules:/app/packages/auth/node_modules
      - core_package_node_modules:/app/packages/core/node_modules
      - infra_database_package_node_modules:/app/packages/infra/database/node_modules
      - infra_env_package_node_modules:/app/packages/infra/env/node_modules
      - observability_package_node_modules:/app/packages/observability/node_modules
      - ui_package_node_modules:/app/packages/ui/node_modules
      - web_node_modules:/app/node_modules

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: bun run dev
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - api_package_node_modules:/app/apps/api/node_modules
      - auth_package_node_modules:/app/packages/auth/node_modules
      - core_package_node_modules:/app/packages/core/node_modules
      - infra_database_package_node_modules:/app/packages/infra/database/node_modules
      - infra_env_package_node_modules:/app/packages/infra/env/node_modules
      - observability_package_node_modules:/app/packages/observability/node_modules
      - api_node_modules:/app/node_modules

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fifilo}
      POSTGRES_USER: ${POSTGRES_USER:-fifilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fifilo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fifilo} -d ${POSTGRES_DB:-fifilo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  api_node_modules:
  api_package_node_modules:
  auth_package_node_modules:
  postgres_data:
  core_package_node_modules:
  infra_database_package_node_modules:
  infra_env_package_node_modules:
  observability_package_node_modules:
  ui_package_node_modules:
  web_package_node_modules:
  web_node_modules:
